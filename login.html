<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Login - Alke Wallet</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.0/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="d-flex align-items-center vh-100">
    <div class="container col-md-4 text-center">
      <div class="wallet-card shadow-lg">
        <h2 class="mb-4">Iniciar Sesión</h2>
        <form id="loginForm" novalidate>
          <div class="form-group text-left">
            <label class="small ml-3">Correo Electrónico</label>
            <input
              type="email"
              id="userEmail"
              class="form-control auth-input"
              placeholder="ejemplo@alke.com"
              required
            />
          </div>
          <div class="form-group text-left">
            <label class="small ml-3">Contraseña</label>
            <input
              type="password"
              id="userPass"
              class="form-control auth-input"
              placeholder="******"
              required
            />
          </div>
          <button type="submit" class="btn btn-custom btn-block py-2 mt-4 shadow">INGRESAR</button>
        </form>
        <div class="mt-4">
          <p class="small text-muted">
            Prueba con: <br />
            <b>admin@alke.com</b> / <b>123456</b>
          </p>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.0/dist/js/bootstrap.min.js"></script>
    <script src="main.js"></script>
  </body>
</html>
