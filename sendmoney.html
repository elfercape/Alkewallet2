<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Enviar Dinero - Alke Wallet</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.0/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar navbar-dark bg-dark px-4 py-3 shadow">
      <a class="navbar-brand" href="menu.html">← Volver</a>
    </nav>

    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="wallet-card">
            <div class="d-flex justify-content-between align-items-center mb-4">
              <h3 class="m-0">Enviar Dinero</h3>
              <button
                class="btn btn-sm btn-outline-info"
                data-toggle="collapse"
                data-target="#formNuevoContacto"
              >
                + Nuevo
              </button>
            </div>

            <div class="collapse mb-4" id="formNuevoContacto">
              <div class="p-3 border border-info rounded" style="background: rgba(0, 0, 0, 0.3)">
                <label class="small">Nombre del contacto</label>
                <input
                  type="text"
                  id="newName"
                  class="form-control auth-input mb-2"
                  placeholder="Nombre completo"
                />
                <button type="button" id="btnGuardarContacto" class="btn btn-info btn-sm btn-block">
                  Guardar en Agenda
                </button>
              </div>
            </div>

            <form id="sendMoneyForm">
              <div class="form-group position-relative">
                <label>Buscar en Agenda</label>
                <input
                  type="text"
                  id="contactSearch"
                  class="form-control auth-input"
                  placeholder="Escribe para buscar..."
                  autocomplete="off"
                  required
                />
                <ul
                  id="contactResults"
                  class="list-group position-absolute w-100 shadow-lg"
                  style="z-index: 1000"
                ></ul>
              </div>

              <div class="form-group mt-4">
                <label>Monto a enviar</label>
                <input
                  type="number"
                  id="sendAmount"
                  class="form-control auth-input"
                  placeholder="0.00"
                  required
                />
              </div>

              <button type="submit" class="btn btn-custom btn-block mt-4 py-3">
                TRANSFERIR AHORA
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.0/dist/js/bootstrap.min.js"></script>
    <script src="main.js"></script>
  </body>
</html>
