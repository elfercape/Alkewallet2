<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Enviar Dinero - Alke Wallet</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.0/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar navbar-dark bg-dark px-4 py-3">
      <a class="navbar-brand" href="menu.html">← Dashboard</a>
    </nav>
    <div class="container mt-5 col-md-6">
      <div class="wallet-card">
        <div class="d-flex justify-content-between mb-4">
          <h3>Enviar Dinero</h3>
          <button
            class="btn btn-outline-info btn-sm"
            data-toggle="collapse"
            data-target="#formNuevo"
          >
            + Nuevo Contacto
          </button>
        </div>

        <div class="collapse mb-4" id="formNuevo">
          <div class="p-3 border border-info rounded bg-dark">
            <input
              type="text"
              id="newName"
              class="form-control auth-input mb-2"
              placeholder="Nombre"
            />
            <input
              type="text"
              id="newPhone"
              class="form-control auth-input mb-2"
              placeholder="Teléfono"
            />
            <input
              type="text"
              id="newCBU"
              class="form-control auth-input mb-3"
              placeholder="CBU / Cuenta"
            />
            <button type="button" id="btnGuardarContacto" class="btn btn-info btn-block btn-sm">
              Guardar en Agenda
            </button>
          </div>
        </div>

        <form id="sendMoneyForm">
          <div class="position-relative">
            <label>Buscar Contacto</label>
            <input
              type="text"
              id="contactSearch"
              class="form-control auth-input"
              placeholder="Nombre..."
              autocomplete="off"
              required
            />
            <ul
              id="contactResults"
              class="list-group position-absolute w-100 shadow-lg"
              style="z-index: 100"
            ></ul>
          </div>
          <div class="mt-4">
            <label>Monto</label>
            <input
              type="number"
              id="sendAmount"
              class="form-control auth-input"
              placeholder="0.00"
              required
            />
          </div>
          <button type="submit" class="btn btn-custom btn-block mt-4 py-3">TRANSFERIR</button>
        </form>
      </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.0/dist/js/bootstrap.min.js"></script>
    <script src="main.js"></script>
  </body>
</html>
