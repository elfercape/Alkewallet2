<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Alke Wallet - Menú</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <nav class="navbar navbar-dark container pt-4">
      <span class="navbar-brand h1">Welcome!</span>
      <button
        class="navbar-toggler border-0"
        type="button"
        data-toggle="collapse"
        data-target="#navbarNav"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
    </nav>

    <div class="container mt-4">
      <div class="wallet-card text-center mb-5">
        <p class="text-muted mb-1">Current Balance</p>
        <h1 id="displaySaldo" class="display-3">₹ 21,050</h1>
      </div>

      <div class="row px-3">
        <div class="col-6 pr-2">
          <a href="sendmoney.html" class="btn btn-purple btn-block">Send</a>
        </div>
        <div class="col-6 pl-2">
          <a href="deposit.html" class="btn btn-purple btn-block">Receive</a>
        </div>
      </div>

      <div class="mt-5">
        <h5 class="mb-4">Recent Transactions</h5>
        <div id="listaTransacciones" class="list-group list-group-flush"></div>
        <a href="transactions.html" class="btn btn-link text-info btn-block mt-3"
          >View All History</a
        >
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
