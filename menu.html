<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Dashboard - Alke Wallet</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.0/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h5 class="mb-0">¡Hola, Usuario!</h5>
          <small class="text-muted">Bienvenido de nuevo</small>
        </div>
        <div class="brand-logo" style="width: 40px; height: 40px; margin: 0; border-radius: 10px">
          <i class="fas fa-user text-white"></i>
        </div>
      </div>

      <div class="wallet-card">
        <p class="small mb-1">Saldo Disponible</p>
        <h1 class="font-weight-bold">₹ 21,050.00</h1>
        <div class="d-flex justify-content-between mt-4">
          <span>**** 4582</span>
          <span class="font-italic">VISA</span>
        </div>
      </div>

      <div class="row no-gutters mb-4">
        <div class="col-6 pr-2">
          <a href="deposit.html" class="btn btn-wallet btn-block py-3"
            ><i class="fas fa-plus mr-2"></i>Recibir</a
          >
        </div>
        <div class="col-6 pl-2">
          <a href="sendmoney.html" class="btn btn-wallet btn-block py-3"
            ><i class="fas fa-paper-plane mr-2"></i>Enviar</a
          >
        </div>
      </div>

      <h6 class="mb-3">Últimas Transacciones</h6>
      <div class="transaction-item">
        <div class="d-flex align-items-center">
          <div class="transaction-icon text-primary"><i class="fas fa-shopping-bag"></i></div>
          <div>
            <p class="mb-0 font-weight-bold">Compra Online</p>
            <small class="text-muted">Hoy, 14:20</small>
          </div>
        </div>
        <span class="text-danger font-weight-bold">-₹ 120.00</span>
      </div>

      <div class="transaction-item">
        <div class="d-flex align-items-center">
          <div class="transaction-icon text-success"><i class="fas fa-wallet"></i></div>
          <div>
            <p class="mb-0 font-weight-bold">Depósito Nómina</p>
            <small class="text-muted">Ayer, 09:00</small>
          </div>
        </div>
        <span class="text-success font-weight-bold">+₹ 2,500.00</span>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.0/dist/js/bootstrap.min.js"></script>
    <script src="main.js"></script>
  </body>
</html>
