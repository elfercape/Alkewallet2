<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Dashboard - Alke Wallet</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.0/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <nav class="navbar navbar-dark bg-dark px-4 py-3 d-flex justify-content-between">
      <span class="navbar-brand">Alke Wallet</span>
      <button id="btnSalir" class="btn btn-outline-danger btn-sm rounded-pill px-4">SALIR</button>
    </nav>

    <div class="container mt-5">
      <div class="wallet-card text-center mb-5">
        <p class="small text-uppercase">Saldo Disponible</p>
        <h1 id="currentBalance" class="display-3 font-weight-bold">$ 0</h1>
      </div>
      <div class="row">
        <div class="col-6">
          <a href="deposit.html" class="btn btn-custom btn-block py-3 shadow">DEPOSITAR</a>
        </div>
        <div class="col-6">
          <a href="sendmoney.html" class="btn btn-custom btn-block py-3 shadow">ENVIAR</a>
        </div>
      </div>
      <div class="text-center mt-5">
        <a href="transactions.html" class="text-info">Ver Historial de Movimientos</a>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
